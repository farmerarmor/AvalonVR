[Render]
ResolutionPercent=100
FlipY=1
; Optional player-centered cascades: less view-dependent fading, shorter range.
ShadowFix=0

[UI]
FlipY=1
AnchorMenus=1

[Effects]
; These options reload while running. Home only restores shader hunting.
DisableMarkedFogLens=1
; Optional removal of the two marked local ground-fog shaders.
DisableGroundFog=0

[Characters]
; Tested headroom and native destruction cleanup for island/mainland travel.
PoolCapacityScale=4
FixDestroyedRegistrations=1

[Debug]
NativeLoadingGuard=1
CharacterPoolDiagnostics=0
ForceStereoWithoutHeadset=0
CaptureFirstPair=0
ShadowConsumerDiagnostics=0

[Performance]
SkipDesktopRender=1
EyeDLSS=1
; 1 Quality, 2 Balanced, 3 Performance, 4 Ultra Performance.
UpscalerPreset=3
DLSSAfterPost=0
AsyncBufferUploads=1
BatchEyeTransfers=1
; Retired experimental paths stay off.
FixedFoveation=0
HiddenAreaMask=0
NativeVrsPasses=1

[QuadViews]
Enabled=1
; Ctrl +/- adjusts size; Shift +/- adjusts strength. Hold to repeat.
; Size/strength tuning is saved after keys are released.
PeripheralResolutionPercent=25
FocusHorizontalPercent=40
FocusVerticalPercent=40
FeatherPercent=12
DebugBorder=0
MatchPeripheralMips=1
SharedExposure=1
MatchFogSampling=1
